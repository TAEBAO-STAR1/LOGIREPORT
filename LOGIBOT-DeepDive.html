<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>LOGIBOT 3D Deep Dive</title>
    <style>
        body { margin: 0; overflow: hidden; background: #001a33; font-family: 'Pretendard', sans-serif; color: white; }
        #canvas-container { width: 100vw; height: 100vh; cursor: grab; }
        
        /* 정보 카드 스타일 */
        .info-card {
            position: fixed; top: 50%; right: 50px; transform: translateY(-50%);
            width: 320px; background: rgba(5, 15, 30, 0.9);
            padding: 30px; border-radius: 20px; border: 1px solid rgba(0, 242, 254, 0.3);
            backdrop-filter: blur(15px); opacity: 0; pointer-events: none;
            transition: all 0.6s cubic-bezier(0.16, 1, 0.3, 1); z-index: 100;
        }
        .info-card.active { opacity: 1; pointer-events: all; transform: translateY(-50%) translateX(0); }
        .info-card h1 { font-size: 1.3rem; margin: 0 0 15px 0; color: #00f2fe; text-shadow: 0 0 10px rgba(0,242,254,0.5); }
        .info-card p { font-size: 0.95rem; line-height: 1.7; color: #cbd5e1; margin: 0; }
        
        /* UI 요소 */
        .depth-indicator {
            position: fixed; left: 40px; top: 50%; transform: translateY(-50%);
            display: flex; flex-direction: column; gap: 25px; z-index: 100;
        }
        .depth-dot {
            width: 10px; height: 10px; border-radius: 50%; background: rgba(255,255,255,0.2);
            cursor: pointer; transition: 0.3s; position: relative;
        }
        .depth-dot::after {
            content: attr(data-label); position: absolute; left: 30px; top: 50%; transform: translateY(-50%);
            white-space: nowrap; font-size: 0.85rem; color: rgba(255,255,255,0.4); opacity: 0; transition: 0.3s;
        }
        .depth-dot.active::after { opacity: 1; color: #00f2fe; }
        .depth-dot.active { background: #00f2fe; box-shadow: 0 0 15px #00f2fe; transform: scale(1.3); }

        .btn-dive {
            position: fixed; bottom: 40px; left: 50%; transform: translateX(-50%);
            padding: 15px 45px; border-radius: 50px; border: none;
            background: linear-gradient(135deg, #00f2fe 0%, #0077be 100%);
            color: #000; font-weight: 800; font-size: 1rem;
            cursor: pointer; z-index: 100; box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            transition: 0.3s;
        }
        .btn-dive:hover { transform: translateX(-50%) translateY(-5px); box-shadow: 0 15px 40px rgba(0,242,254,0.3); }

        .logo { position: fixed; top: 30px; left: 30px; color: #00f2fe; font-weight: bold; font-size: 1.2rem; letter-spacing: 2px; }
    </style>
</head>
<body>

<div class="logo">LOGIBOT DEEP DIVE</div>
<div id="canvas-container"></div>

<div id="card" class="info-card">
    <div id="card-content"></div>
</div>

<div class="depth-indicator">
    <div class="depth-dot active" data-label="수면 위 (UI)" onclick="goToDepth(0)"></div>
    <div class="depth-dot" data-label="얕은 바다 (Data)" onclick="goToDepth(1)"></div>
    <div class="depth-dot" data-label="깊은 바다 (Security)" onclick="goToDepth(2)"></div>
    <div class="depth-dot" data-label="심해 (Knowledge)" onclick="goToDepth(3)"></div>
</div>

<button class="btn-dive" id="dive-btn" onclick="nextDepth()">DEEP DIVE ↓</button>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/tween.js/18.6.4/tween.umd.js"></script>

<script>
    let scene, camera, renderer, iceberg, nodes = [];
    let currentDepth = 0;

    const depthData = [
        { y: 15, camY: 18, camZ: 25, title: "01. 사용자 인터페이스", content: "로지봇 채팅창은 수면 위로 드러난 5%의 접점입니다. 누구나 쉽고 빠르게 전문 지식에 접근할 수 있는 통로가 됩니다." },
        { y: 0, camY: 2, camZ: 22, title: "02. 실시간 데이터 통합", content: "수면 바로 아래에는 SAP, G/W와 실시간으로 동기화된 데이터 엔진이 위치합니다. 단순 답변을 넘어 실제 수치를 분석합니다." },
        { y: -15, camY: -13, camZ: 20, title: "03. 보안 & RAG 엔진", content: "깊은 바다의 수압처럼 견고한 보안망 내에서 사내 기밀을 처리합니다. 외부 유출 걱정 없는 독립적 지능을 실현합니다." },
        { y: -30, camY: -28, camZ: 18, title: "04. DRB 디지털 자산화", content: "가장 깊은 곳, 흔들리지 않는 뿌리는 우리 구성원의 노하우입니다. 개인의 지식이 조직의 영구적 자산으로 고착됩니다." }
    ];

    init();
    animate();

    function init() {
        // 1. 씬 설정
        scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x001a33, 0.015);

        // 2. 카메라 설정
        camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 18, 25);

        // 3. 렌더러 설정
        renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setClearColor(0x87ceeb); // 초기 하늘색
        document.getElementById('canvas-container').appendChild(renderer.domElement);

        // 4. 조명
        const light = new THREE.DirectionalLight(0xffffff, 1.2);
        light.position.set(5, 20, 10);
        scene.add(light);
        scene.add(new THREE.AmbientLight(0x404040, 1.5));

        // 5. 빙산 모델 (Low-Poly)
        const geometry = new THREE.IcosahedronGeometry(10, 1);
        geometry.scale(1, 3, 1);
        const material = new THREE.MeshStandardMaterial({ 
            color: 0xffffff, flatShading: true, transparent: true, opacity: 0.9 
        });
        iceberg = new THREE.Mesh(geometry, material);
        iceberg.position.y = -10;
        scene.add(iceberg);

        // 6. 수면
        const waterGeom = new THREE.PlaneGeometry(200, 200);
        const waterMat = new THREE.MeshStandardMaterial({ 
            color: 0x0077be, transparent: true, opacity: 0.6, side: THREE.DoubleSide 
        });
        const water = new THREE.Mesh(waterGeom, waterMat);
        water.rotation.x = -Math.PI / 2;
        water.position.y = 12;
        scene.add(water);

        // 7. 깊이별 노드 생성
        depthData.forEach((d, i) => {
            if (i === 0) return;
            const nodeGeom = new THREE.SphereGeometry(0.8, 16, 16);
            const nodeMat = new THREE.MeshBasicMaterial({ color: 0x00f2fe });
            const node = new THREE.Mesh(nodeGeom, nodeMat);
            node.position.set(Math.sin(i)*5, d.y, Math.cos(i)*5);
            scene.add(node);
            nodes.push(node);
            
            const pLight = new THREE.PointLight(0x00f2fe, 1, 15);
            pLight.position.copy(node.position);
            scene.add(pLight);
        });

        // 리사이즈
        window.addEventListener('resize', onWindowResize, false);
        
        // 초기 카드 표시
        goToDepth(0);
    }

    function goToDepth(depth) {
        currentDepth = depth;
        const target = depthData[depth];

        // 카메라 이동 애니메이션
        new TWEEN.Tween(camera.position)
            .to({ y: target.camY, z: target.camZ }, 1500)
            .easing(TWEEN.Easing.Quadratic.InOut)
            .start();

        // 배경색 변경
        const sky = new THREE.Color(0x87ceeb);
        const deep = new THREE.Color(0x001020);
        const targetColor = sky.clone().lerp(deep, depth / 3);
        
        // 카드 업데이트
        const card = document.getElementById('card');
        document.getElementById('card-content').innerHTML = `<h1>${target.title}</h1><p>${target.content}</p>`;
        card.classList.add('active');

        // UI 업데이트
        document.querySelectorAll('.depth-dot').forEach((dot, idx) => {
            dot.classList.toggle('active', idx === depth);
        });

        const btn = document.getElementById('dive-btn');
        btn.innerText = (depth === 3) ? "SURFACE ↑" : "DEEP DIVE ↓";
        
        // 렌더러 배경색 부드럽게 전환
        renderer.setClearColor(targetColor);
    }

    function nextDepth() {
        goToDepth((currentDepth + 1) % 4);
    }

    function onWindowResize() {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    }

    function animate() {
        requestAnimationFrame(animate);
        TWEEN.update();
        iceberg.rotation.y += 0.001;
        renderer.render(scene, camera);
    }
</script>

</body>
</html>
